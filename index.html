<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Karteikarten Anatomie ZASS 2026</title>
    <link rel="stylesheet" href="style.css?v=20260914-short">
  </head>
  <body>
    <nav class="site-navigation" aria-label="Hauptnavigation">
      <a href="index.html" aria-current="page">Karteikarten</a>
      <a href="kreislauf.html">Kreislauf entdecken</a>
    </nav>
    <header class="app-header">
      <div class="title-block">
        <p class="eyebrow">ANATOMIE ZASS 2026</p>
        <h1>Karteikarten</h1>
        <p class="deck-range">Skriptseiten 64–206</p>
      </div>
      <div class="progress-wrap" aria-label="Fortschritt">
        <span id="counter">0 / 0</span>
        <div class="progress-track">
          <span id="progressBar"></span>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="study-area" aria-label="Karteikarte">
        <div class="deck-switcher" aria-label="Lernpaket auswählen">
          <button class="deck-tab is-active" type="button" data-deck="old">Gewebe</button>
          <button class="deck-tab" type="button" data-deck="new">Blut, Knochen &amp; Muskeln</button>
          <button class="deck-tab" type="button" data-deck="brain">Gehirn &amp; Nervenzellen</button>
          <button class="deck-tab" type="button" data-deck="circulation">Nerven &amp; Kreislauf</button>
          <button class="deck-tab" type="button" data-deck="all">Alle Karten</button>
        </div>

        <div id="circulationVersions" class="version-picker" hidden>
          <span>Nerven &amp; Kreislauf</span>
          <div class="version-segments" role="group" aria-label="Version für Nerven und Kreislauf">
            <button type="button" data-version="original" aria-pressed="true">Original</button>
            <button type="button" data-version="short" aria-pressed="false">2.0</button>
          </div>
        </div>

        <div class="toolbar">
          <label class="search">
            <span>Suche</span>
            <input id="searchInput" type="search" placeholder="Begriff eingeben">
          </label>
          <label class="select">
            <span>Thema</span>
            <select id="topicSelect"></select>
          </label>
          <button id="shuffleButton" type="button" title="Karten mischen">Mischen</button>
          <button id="resetButton" type="button" title="Zur ersten Karte">Start</button>
          <button id="exportButton" type="button" title="CSV exportieren">CSV</button>
        </div>

        <button id="flashcard" class="flashcard" type="button" aria-live="polite" title="Zum Umdrehen tippen">
          <span id="cardMeta" class="card-meta"></span>
          <span id="cardLabel" class="card-label">Frage</span>
          <span id="cardContent" class="card-content"></span>
        </button>

        <div class="controls">
          <button id="prevButton" type="button" title="Vorherige Karte">‹</button>
          <button id="flipButton" type="button">Umdrehen</button>
          <button id="knownButton" type="button">Gemerkt</button>
          <button id="nextButton" type="button" title="Nächste Karte">›</button>
        </div>
      </section>

      <aside class="side-panel" aria-label="Karten und Originalfolie">
        <section class="source-panel">
          <div class="panel-title">
            <h2>Originalfolie</h2>
            <span id="sourceMeta"></span>
          </div>
          <img id="slideImage" alt="Originalfolie aus dem PDF">
        </section>

        <section class="list-panel">
          <div class="panel-title">
            <h2>Karten</h2>
            <span id="learnedCount"></span>
          </div>
          <div id="cardList" class="card-list"></div>
        </section>
      </aside>
    </main>

    <script src="new-cards.js?v=20260912" defer></script>
    <script src="short-cards.js?v=20260914-simple" defer></script>
    <script src="script.js?v=20260914-short" defer></script>
  </body>
</html>
